  build-flatpak:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: "sudo apt install libgtk-4-dev libadwaita-1-dev meson desktop-file-utils gcc gtk-update-icon-cache"
    - name: Build Flatpak bundle
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: albumcard-${{ matrix.arch }}.flatpak
        manifest-path: io.github.pisekpiskovec.AlbumCard.json
        arch: ${{ matrix.arch }}
        cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
    - name: Upload Flatpak to release
      uses: softprops/action-gh-release@v2
      with:
        files: albumcard-${{ matrix.arch }}.flatpak
