[package]
name = "album-card"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
relm4 = { version = "0.11.0", features = ["macros", "libadwaita"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.4"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
