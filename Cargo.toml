[package]
name = "albumcard"
version = "0.7.0"
edition = "2024"
license = "GPLv3"
description = "Next generation of audio taggers"
repository = "https://github.com/pisekpiskovec/AlbumCard"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/albumcard", dest = "/usr/bin/albumcard", mode = "755"},
  { source = "data/io.github.pisekpiskovec.AlbumCard.desktop", dest = "/usr/share/applications/breadboard.desktop", mode = "644"},
]

[package.metadata.deb]
section = "sound"
depends = "$auto"
assets = [
  { source = "target/release/albumcard", dest = "/usr/bin/albumcard", mode = "755"},
  { source = "data/io.github.pisekpiskovec.AlbumCard.desktop", dest = "/usr/share/applications/breadboard.desktop", mode = "644"},
]

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
relm4 = { version = "0.11.0", features = ["macros", "libadwaita"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.4"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
